<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>설계사 생일 관리</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar">
        <ul class="nav-links">
            <li><a href="#home">홈</a></li>
            <li><a href="#dashboard">데이터 관리</a></li>
        </ul>
    </nav>

    <main>
        <section id="home" class="hero">
            <div class="hero-content">
                <h1 class="hero-title"><span>설계사</span> 생일 관리</h1>
                <div class="hero-buttons">
                    <input type="file" id="excel-upload-main" accept=".csv, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, application/vnd.ms-excel" style="display: none;">
                    <button class="btn-primary large" onclick="document.getElementById('excel-upload-main').click()">데이터
                        업로드 📁</button>
                    <button class="btn-secondary large" id="hero-sample-download">양식 다운로드 ⬇️</button>
                </div>
            </div>

            <div class="hero-visual">
                <div class="glass-card main-card">
                    <div class="card-header">
                        <h3 id="current-month-title">이번 달 생일자</h3>
                        <span class="badge" id="current-month-count">대기중</span>
                    </div>
                    <ul class="birthday-list" id="hero-birthday-list">
                        <div class="empty-state-mini">데이터를 업로드하면 당월 생일자가 표시됩니다.</div>
                    </ul>
                </div>

                <div class="glass-card alert-card floating-anim" id="hero-alert-card" style="display: none;">
                    <div class="alert-icon">🎂</div>
                    <div class="alert-text">
                        <strong id="hero-alert-text">누군가의 생일이 다가옵니다!</strong>
                        <span>선물을 준비하셨나요?</span>
                    </div>
                </div>
            </div>
        </section>

        <section id="dashboard" class="dashboard">
            <div class="dashboard-header">
                <h2>전체 생일 데이터</h2>
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="search-input" placeholder="이름으로 찾기 (예: 홍길동)">
                </div>
                <div class="controls flex-wrap">
                    <button class="btn-secondary" onclick="openLunarModal()">음력 변환기 🌙</button>
                    <input type="file" id="excel-upload-dash" accept=".csv, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, application/vnd.ms-excel" style="display: none;">
                    <button class="btn-secondary" onclick="document.getElementById('excel-upload-dash').click()">새 데이터
                        병합 📁</button>
                    <button class="btn-secondary default-btn" id="dash-sample-download">양식 다운로드 ⬇️</button>
                    <button class="btn-secondary danger" id="clear-data">전체 삭제 🗑️</button>
                </div>
            </div>

            <div class="dashboard-content" id="dashboard-content">
                <div class="empty-state">
                    <h3>아직 등록된 데이터가 없습니다.</h3>
                    <p>상단의 '데이터 업로드' 버튼을 통해 엑셀 파일을 업로드 해주세요.</p>
                    <p class="guide-text">※ 처음이신가요? <strong>'양식 다운로드'</strong> 버튼을 통해 템플릿을 받아 작성해 보세요.</p>
                </div>
            </div>
        </section>
    </main>

    <div class="modal-overlay" id="lunar-modal">
        <div class="modal-content glass-card">
            <button class="modal-close" onclick="closeLunarModal()">✕</button>
            <h3 style="margin-bottom: 1.5rem; color: var(--accent-2);">올해의 양력 생일 찾기 (음력 → 양력)</h3>
            <p style="font-size: 0.9rem; margin-bottom: 1rem; color: var(--text-secondary);">
                올해(2026년 기준) 대상자의 음력 생일 날짜를 입력하면 올해 양력으로 며칠인지 계산해 드립니다.
            </p>
            <div class="modal-form">
                <input type="number" id="lunar-m" placeholder="음력 월 (예: 5)" min="1" max="12">
                <input type="number" id="lunar-d" placeholder="음력 일 (예: 15)" min="1" max="31">
                <button class="btn-primary" onclick="convertLunarToSolar()">변환하기</button>
            </div>
            <div id="lunar-result" class="modal-result" style="display: none;">
                </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/lunar-javascript/lunar.js"></script>
    <script src="app.js"></script>
</body>

</html>
